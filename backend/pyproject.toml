[project]
name = "kys"
version = "0.1.0"
description = "KYS Ajan Sistemi: kalite yönetim sistemi bilgi tabanı ve analiz ajanları"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "pypdfium2>=4",
    "openpyxl>=3.1",
]

[project.scripts]
kys = "kys.cli:main"

[project.optional-dependencies]
# Sorgu servisi (konteyner): REST API + web sayfası + MCP uç noktası
server = ["fastapi>=0.115", "uvicorn>=0.30", "mcp>=1.10", "python-multipart>=0.0.9"]
# Yerel OCR (Windows.Media.Ocr, WinRT): taranmış / görüntü ağırlıklı PDF sayfaları
ocr = ["pypdfium2>=4", "pillow>=10", "winrt-runtime>=3", "winrt-Windows.Media.Ocr>=3",
       "winrt-Windows.Globalization>=3", "winrt-Windows.Graphics.Imaging>=3",
       "winrt-Windows.Storage.Streams>=3", "winrt-Windows.Foundation>=3",
       "winrt-Windows.Foundation.Collections>=3"]
dev = ["pytest>=8", "reportlab>=4", "httpx>=0.27"]  # reportlab: testte PDF fixture üretmek için

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kys*"]

[tool.setuptools.package-data]
kys = ["schema.sql", "prompts/*.md", "api/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
