<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KYS Sorgu</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6676; --line: #dde1e8;
    --accent: #1f5fae; --accent-soft: #e8f0fb; --warn: #9a5b00; --warn-soft: #fff4e0; --ok: #1e7a4c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --panel: #1c2027; --text: #e6e9ef; --muted: #9aa3b2; --line: #2d333d;
            --accent: #6ea8ff; --accent-soft: #1f2b3d; --warn: #f0b252; --warn-soft: #33281a; --ok: #5fd39a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
           display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; }
  header small { color: var(--muted); }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  nav { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  nav button { border: 1px solid var(--line); background: var(--panel); color: var(--text);
               padding: 7px 14px; border-radius: 6px; cursor: pointer; font: inherit; }
  nav button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  form { display: flex; gap: 8px; margin-bottom: 14px; }
  input, textarea, select { flex: 1; min-width: 0; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px;
                    background: var(--panel); color: var(--text); font: inherit; }
  textarea { min-height: 70px; resize: vertical; }
  form button { padding: 9px 16px; border: 0; border-radius: 6px; background: var(--accent); color: #fff;
                font: inherit; cursor: pointer; }
  form button:disabled { opacity: .6; cursor: wait; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
          margin-bottom: 10px; }
  .ref { font-size: 13px; color: var(--accent); font-weight: 600; cursor: pointer; }
  .meta { font-size: 13px; color: var(--muted); }
  .quote { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 6px 10px;
           margin: 6px 0 0; font-size: 14px; }
  .warn { background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 8px 10px; font-size: 14px; }
  .answer { white-space: pre-wrap; }
  .pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px;
          background: var(--accent-soft); color: var(--accent); margin-right: 6px; }
  pre { white-space: pre-wrap; font: inherit; margin: 6px 0 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .hidden { display: none; }
  main.wide { max-width: 1600px; }
  .flow-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  .flow-pane { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px;
               overflow: auto; max-height: 78vh; }
  #flow-svg svg { max-width: none; height: auto; }
  #flow-svg g.node { cursor: pointer; }
  #flow-svg g.node.sel rect, #flow-svg g.node.sel polygon, #flow-svg g.node.sel path { stroke: var(--accent) !important; stroke-width: 3px !important; }
  #page-img { max-width: 100%; display: block; border: 1px solid var(--line); background: #fff; }
  .pager { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .pager button { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px;
                  padding: 4px 12px; cursor: pointer; font: inherit; }
  @media (max-width: 900px) { .flow-grid { grid-template-columns: 1fr; } }
  @media (max-width: 600px) { form { flex-direction: column; } .hide-sm { display: none; } }
</style>
</head>
<body>
<header><h1>KYS Sorgu</h1><small id="status">yükleniyor…</small></header>
<main>
  <nav>
    <button data-tab="ask" class="on">Soru sor</button>
    <button data-tab="search">Ara</button>
    <button data-tab="docs">Dokümanlar</button>
    <button data-tab="flow">Süreçler</button>
    <button data-tab="refs">Eksik atıflar</button>
  </nav>

  <div id="login" class="card hidden">
    <form id="login-form"><input id="token" type="password" placeholder="Erişim anahtarı" autocomplete="current-password">
      <button>Giriş</button></form>
    <div class="meta">Anahtar yalnızca bu tarayıcıda saklanır.</div>
  </div>

  <section id="tab-ask">
    <form id="ask-form"><textarea id="question" placeholder="Örn: Arıza bildiriminde operatörün sorumlulukları nelerdir?"></textarea>
      <button>Sor</button></form>
    <div id="ask-out"></div>
  </section>
  <section id="tab-search" class="hidden">
    <form id="search-form"><input id="q" placeholder="Örn: yangin dolabi aylik kontrol"><button>Ara</button></form>
    <div id="search-out"></div>
  </section>
  <section id="tab-docs" class="hidden">
    <form id="docs-form"><select id="doctype"><option value="">Tüm tipler</option></select></form>
    <div id="docs-out"></div>
  </section>
  <section id="tab-refs" class="hidden"><div id="refs-out"></div></section>
  <section id="tab-flow" class="hidden">
    <form id="flow-form"><select id="flow-sel"><option value="">Süreç seçin…</option></select></form>
    <div id="flow-info"></div>
    <div class="flow-grid" id="flow-grid">
      <div class="flow-pane"><div id="flow-svg" class="meta">Yukarıdan bir süreç seçin. Bir adıma tıklayınca alıntısı ve kaynak sayfası açılır.</div></div>
      <div class="flow-pane">
        <div id="step-card"></div>
        <div class="pager"><button id="pg-prev" type="button">&larr;</button><span id="pg-label" class="meta"></span>
          <button id="pg-next" type="button">&rarr;</button></div>
        <div id="page-msg" class="meta"></div>
        <img id="page-img" alt="Orijinal doküman sayfası" class="hidden">
      </div>
    </div>
  </section>
  <section id="tab-doc" class="hidden"><div id="doc-out"></div></section>
</main>
<script>
const BASE = location.pathname.replace(/\/$/, "");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let token = ""; try { token = localStorage.getItem("kys-token") || ""; } catch (e) {}

async function api(path, opts = {}) {
  const headers = {"Content-Type": "application/json", ...(token ? {Authorization: "Bearer " + token} : {})};
  const r = await fetch(BASE + "/api" + path, {...opts, headers});
  if (r.status === 401) { $("login").classList.remove("hidden"); throw new Error("Erişim anahtarı gerekli"); }
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || r.statusText); }
  return r.json();
}
const fail = (el, e) => { $(el).innerHTML = `<div class="warn">${esc(e.message)}</div>`; };
const ref = (d) => `<span class="ref" data-code="${esc(d.code)}">${esc(d.code)} Rev.${esc(d.revision)}${d.clause_no ? " md." + esc(d.clause_no) : ""}</span>`;

function show(tab) {
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  ["ask", "search", "docs", "flow", "refs", "doc"].forEach((t) => $("tab-" + t).classList.toggle("hidden", t !== tab));
  document.querySelector("main").classList.toggle("wide", tab === "flow");
  if (tab === "flow" && $("flow-sel").options.length < 2) loadProcessList();
  if (tab === "docs" && !$("docs-out").innerHTML) loadDocs();
  if (tab === "refs" && !$("refs-out").innerHTML) loadRefs();
}
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => show(b.dataset.tab));
document.addEventListener("click", (e) => { const c = e.target.closest(".ref")?.dataset.code; if (c) openDoc(c); });

$("login-form").onsubmit = (e) => { e.preventDefault(); token = $("token").value.trim();
  try { localStorage.setItem("kys-token", token); } catch (e) {} $("login").classList.add("hidden"); init(); };

$("ask-form").onsubmit = async (e) => {
  e.preventDefault(); const q = $("question").value.trim(); if (!q) return;
  const btn = e.target.querySelector("button"); btn.disabled = true; $("ask-out").innerHTML = '<div class="meta">Dokümanlar taranıyor…</div>';
  try {
    const a = await api("/ask", {method: "POST", body: JSON.stringify({question: q})});
    let h = `<div class="card"><div class="answer">${esc(a.answer)}</div>`;
    if (!a.yeterli_bilgi) h += `<div class="warn" style="margin-top:8px">Dokümanlar bu soruyu tam cevaplamaya yetmiyor.</div>`;
    if (a.unverified) h += `<div class="warn" style="margin-top:8px">${a.unverified} alıntı kaynak metinde doğrulanamadığı için gösterilmedi.</div>`;
    h += `<div class="meta" style="margin-top:8px">${esc(a.model)}</div></div>`;
    for (const c of a.citations) h += `<div class="card">[${c.no}] ${ref(c)} <span class="meta">${esc(c.title)}</span><div class="quote">${esc(c.quote)}</div></div>`;
    $("ask-out").innerHTML = h;
  } catch (err) { fail("ask-out", err); } finally { btn.disabled = false; }
};

$("search-form").onsubmit = async (e) => {
  e.preventDefault(); const q = $("q").value.trim(); if (!q) return;
  try {
    const rows = await api("/search?q=" + encodeURIComponent(q));
    $("search-out").innerHTML = rows.length ? rows.map((r) =>
      `<div class="card">${ref(r)} <span class="meta">${esc(r.title)}${r.heading ? " · " + esc(r.heading) : ""}</span><pre>${esc(r.text.slice(0, 500))}</pre></div>`).join("")
      : '<div class="meta">Sonuç yok.</div>';
  } catch (err) { fail("search-out", err); }
};

async function loadDocs() {
  try {
    const rows = await api("/documents" + ($("doctype").value ? "?doc_type=" + $("doctype").value : ""));
    $("docs-out").innerHTML = `<div class="card"><table><tr><th>Kod</th><th>Doküman</th><th class="hide-sm">Tip</th></tr>` +
      rows.map((d) => `<tr><td>${ref(d)}</td><td>${esc(d.title)}</td><td class="hide-sm meta">${esc(d.doc_type)}</td></tr>`).join("") + "</table></div>";
  } catch (err) { fail("docs-out", err); }
}
$("doctype").onchange = loadDocs;

async function loadRefs() {
  try {
    const r = await api("/references");
    $("refs-out").innerHTML = `<div class="card"><div class="meta">Dokümanlarda atıf yapılan ama sistemde bulunmayan kodlar</div><table>` +
      r.missing_documents.map((m) => `<tr><td><b>${esc(m.code)}</b></td><td class="meta">${m.referenced_from.map((c) => `<span class="ref" data-code="${esc(c)}">${esc(c)}</span>`).join(", ")}</td></tr>`).join("") +
      `</table></div><div class="card meta">Doküman kodu olmayabilir (makine/hat adı): ${r.probably_not_documents.map(esc).join(", ") || "-"}</div>`;
  } catch (err) { fail("refs-out", err); }
}

async function openDoc(code) {
  show("doc"); $("doc-out").innerHTML = '<div class="meta">Yükleniyor…</div>';
  try {
    const d = await api("/documents/" + encodeURIComponent(code));
    let h = `<div class="card"><span class="pill">${esc(d.doc_type)}</span><b>${esc(d.code)} Rev.${esc(d.revision)}</b> — ${esc(d.title)}
      <div class="meta">${esc(d.status)}${d.revision_date ? " · Rev. tarihi " + esc(d.revision_date) : ""}${d.owner_unit ? " · " + esc(d.owner_unit) : ""}</div>
      ${d.summary ? `<p>${esc(d.summary)}</p>` : ""}${d.warnings.map((w) => `<div class="warn" style="margin-top:6px">${esc(w)}</div>`).join("")}</div>`;
    if (d.references.length) h += `<div class="card meta">Atıf yaptığı: ${d.references.map((r) => r.target_code ? `<span class="ref" data-code="${esc(r.target_code)}">${esc(r.ref_code)}</span>` : `${esc(r.ref_code)} (sistemde yok)`).join(", ")}</div>`;
    if (d.referenced_by.length) h += `<div class="card meta">Atıf yapan: ${d.referenced_by.map((r) => `<span class="ref" data-code="${esc(r.code)}">${esc(r.code)}</span>`).join(", ")}</div>`;
    h += d.sections.map((s) => `<div class="card"><b>${esc(s.heading_path || s.heading || "")}</b><pre>${esc(s.text)}</pre></div>`).join("");
    $("doc-out").innerHTML = h;
  } catch (err) { fail("doc-out", err); }
}

// ---- Süreçler: Mermaid akış şeması + orijinal PDF sayfası ----
const MERMAID_URL = "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js";
let mermaidReady = null, cur = null, curPage = 1, imgUrl = null, flowSeq = 0;
function loadMermaid() {
  if (!mermaidReady) mermaidReady = new Promise((ok, no) => {
    const sc = document.createElement("script"); sc.src = MERMAID_URL; sc.crossOrigin = "anonymous";
    sc.onload = () => { const dark = matchMedia("(prefers-color-scheme: dark)").matches;
      mermaid.initialize({startOnLoad: false, securityLevel: "strict", theme: dark ? "dark" : "default", flowchart: {htmlLabels: true}}); ok(); };
    sc.onerror = () => { mermaidReady = null; no(new Error("Mermaid kütüphanesi yüklenemedi (internet bağlantısı gerekir)")); };
    document.head.appendChild(sc);
  });
  return mermaidReady;
}
async function loadProcessList() {
  try {
    const rows = await api("/processes");
    $("flow-sel").innerHTML = '<option value="">Süreç seçin…</option>' + rows.map((p) =>
      `<option value="${esc(p.code)}">${esc(p.code)} — ${esc(p.name)} (${p.step_count} adım)</option>`).join("");
  } catch (err) { $("flow-info").innerHTML = `<div class="warn">${esc(err.message)}</div>`; }
}
$("flow-sel").onchange = () => { if ($("flow-sel").value) openProcess($("flow-sel").value); };

async function openProcess(code) {
  const my = ++flowSeq;
  $("flow-svg").innerHTML = '<div class="meta">Yükleniyor…</div>'; $("step-card").innerHTML = "";
  try {
    const [p] = await Promise.all([api("/processes/" + encodeURIComponent(code)), loadMermaid()]);
    if (my !== flowSeq) return;
    cur = p; curPage = 1;
    $("flow-info").innerHTML = `<div class="card"><b>${esc(p.code)}</b> — ${esc(p.name)}
      <div class="meta">Kaynak: <span class="ref" data-code="${esc(p.document_code)}">${esc(p.document_code)} Rev.${esc(p.revision)}</span>
      · ${p.steps.length} adım${p.page_count ? " · " + p.page_count + " sayfa" : ""}</div>
      <div class="warn" style="margin-top:6px">Akış şeması dokümandan otomatik çıkarılmıştır; adımları ve okları sağdaki orijinal sayfayla karşılaştırarak doğrulayın.
      İki çıkışlı karar adımlarında ilk çıkış "Evet", ikincisi "Hayır" varsayılır.</div></div>`;
    const {svg, bindFunctions} = await mermaid.render("mm" + my, p.mermaid);
    if (my !== flowSeq) return;
    $("flow-svg").innerHTML = svg; bindFunctions?.($("flow-svg"));
    $("flow-svg").querySelectorAll("g.node").forEach((g) => {
      const m = /^flowchart-s(\d+)-/.exec(g.id); if (m) g.onclick = () => selectStep(+m[1]);
    });
    await showPage(p.steps.find((s) => s.page)?.page || 1);
  } catch (err) { $("flow-svg").innerHTML = `<div class="warn">${esc(err.message)}</div>`; }
}
function selectStep(seq) {
  const s = cur.steps.find((x) => x.seq === seq); if (!s) return;
  $("flow-svg").querySelectorAll("g.node").forEach((g) => g.classList.toggle("sel", g.id.startsWith("flowchart-s" + seq + "-")));
  const next = s.next_steps.map((n) => cur.steps.find((x) => x.seq === n)).filter(Boolean);
  $("step-card").innerHTML = `<div class="card"><span class="pill">Adım ${s.seq}</span><b>${esc(s.name)}</b>
    <div class="meta">${s.responsible ? "Sorumlu: " + esc(s.responsible) : "Sorumlu belirtilmemiş"}${s.approver ? " · Onaycı: " + esc(s.approver) : ""}${s.system ? " · Sistem: " + esc(s.system) : ""}</div>
    ${s.decision ? `<div class="meta">Karar: ${esc(s.decision)}</div>` : ""}
    ${next.length ? `<div class="meta">Sonraki: ${next.map((n) => esc(n.seq + ". " + n.name)).join(" · ")}</div>` : ""}
    ${s.quote ? `<div class="quote">${esc(s.quote)}</div><div class="meta">${ref({code: cur.document_code, revision: cur.revision})}${s.page ? " · sayfa " + s.page : ""}</div>` : '<div class="meta">Bu adım için alıntı yok.</div>'}</div>`;
  if (s.page) showPage(s.page);
}
async function showPage(n) {
  const total = cur.page_count || 0;
  if (!cur.is_pdf) { $("page-img").classList.add("hidden"); $("page-msg").textContent = "Kaynak PDF değil; sayfa görüntüsü yok."; return; }
  if (total) n = Math.min(Math.max(n, 1), total);
  curPage = n; $("pg-label").textContent = `Sayfa ${n}${total ? " / " + total : ""}`; $("page-msg").textContent = "Sayfa yükleniyor…";
  try {
    const r = await fetch(BASE + "/api/documents/" + encodeURIComponent(cur.document_code) + "/pages/" + n + ".png",
                          {headers: token ? {Authorization: "Bearer " + token} : {}});
    if (curPage !== n) return;
    if (!r.ok) { $("page-img").classList.add("hidden");
      $("page-msg").textContent = r.status === 404 ? "Bu sayfanın görüntüsü sunucuda yok (orijinal dosya yüklenmemiş)." : "Sayfa alınamadı: " + r.status; return; }
    const url = URL.createObjectURL(await r.blob()); if (imgUrl) URL.revokeObjectURL(imgUrl); imgUrl = url;
    $("page-img").src = url; $("page-img").classList.remove("hidden"); $("page-msg").textContent = "";
  } catch (err) { $("page-msg").textContent = err.message; }
}
$("pg-prev").onclick = () => cur && showPage(curPage - 1);
$("pg-next").onclick = () => cur && showPage(curPage + 1);

async function init() {
  try {
    const s = await api("/stats");
    $("status").textContent = `${s.documents} doküman · son güncelleme ${String(s.last_update || "").slice(0, 10)}`;
    $("doctype").innerHTML = '<option value="">Tüm tipler</option>' + Object.keys(s.by_type).sort().map((t) => `<option>${esc(t)}</option>`).join("");
  } catch (err) { $("status").textContent = err.message; }
}
init();
</script>
</body>
</html>
