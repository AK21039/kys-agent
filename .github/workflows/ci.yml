name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev,server]"
      - run: pytest -q
        working-directory: backend

  image:
    # Konteyner imajı: ghcr.io/ak21039/kys-agent (depo gizli olduğu için imaj da gizlidir)
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ak21039/kys-agent:latest
            ghcr.io/ak21039/kys-agent:${{ github.sha }}
      - name: Duman testi (nginx + uvicorn birleşik konteyner)
        run: |
          docker run -d --name kys -p 8080:8080 \
            -e KYS_BASE_PATH=/qa \
            -e KYS_ACCESS_TOKEN=test-token \
            -e KYS_DB_URL= \
            ghcr.io/ak21039/kys-agent:${{ github.sha }}
          # Nginx ve uvicorn başlatılana kadar bekle (supervisor ile ~10-15 sn)
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/qa/api/health >/dev/null 2>&1; then
              echo "Health endpoint hazır"
              break
            fi
            sleep 2
          done
          # Frontend testi
          curl -fs http://localhost:8080/qa/ | grep -q "KYS Sorgu"
          # API testi (token ile)
          curl -fs -H "Authorization: Bearer test-token" http://localhost:8080/qa/api/health | grep -q "healthy"
          docker logs kys
