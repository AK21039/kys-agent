[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_err.log
autorestart=true
priority=10

[program:uvicorn]
command=uvicorn kys.api.app:app --host 0.0.0.0 --port 8081 --workers 1
directory=/app/backend
stdout_logfile=/var/log/supervisor/uvicorn.log
stderr_logfile=/var/log/supervisor/uvicorn_err.log
autorestart=true
priority=20
environment=PYTHONPATH="/app/backend",KYS_BASE_PATH="/qa",PORT="8081"