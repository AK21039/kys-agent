[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/var/run/supervisord.pid

; nginx master runs as root; workers drop to www-data (Debian nginx.conf "user" directive)
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; python -m: only site-packages is copied into the runtime image, not the uvicorn console script
[program:uvicorn]
command=python -m uvicorn kys.api.app:app --host %(ENV_UVICORN_HOST)s --port %(ENV_UVICORN_PORT)s --proxy-headers --forwarded-allow-ips="*"
user=kys
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
environment=KYS_DB_PATH="/data/kys.db",KYS_OVERRIDES_PATH="/data/kys_overrides.json",KYS_BASE_PATH="/qa",KYS_WEB_DIR="/app/web",PYTHONPATH="/app",HOME="/home/kys"
