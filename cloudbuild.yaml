steps:
  # 1. Adım: imajı build eder (React web + Python servisi, tek Dockerfile)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_IMAGE}:$BUILD_ID', '.']

  # 2. Adım: imajı Artifact Registry'ye yükler
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE}:$BUILD_ID']

  # 3. Adım: kys-qa servisini yalnızca yeni imajla günceller. Ortam değişkenleri, secret'lar, veri bucket'ı
  # bağlantısı (/data) ve ölçek ayarları serviste durur, burada ezilmez. qa.paktenops.com Worker'ı bu servise bakar.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'kys-qa'
      - '--image=${_IMAGE}:$BUILD_ID'
      - '--region=europe-west1'

substitutions:
  _IMAGE: 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/kys-agent/kys-qa'

options:
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true
