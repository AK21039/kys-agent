steps:
  # 1. Adım: Dockerfile'ınızı kullanarak imajı build eder (AI branch - multi-stage nginx+uvicorn+supervisor)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/kys-agent-ai:$COMMIT_SHA', '.']

  # 2. Adım: Build edilen imajı Google Container Registry'ye yükler
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/kys-agent-ai:$COMMIT_SHA']

  # 3. Adım: Cloud Run servisini deploy eder (veya günceller) - kys-agent-ai
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'kys-agent-ai'
      - '--image=gcr.io/$PROJECT_ID/kys-agent-ai:$COMMIT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=KYS_BASE_PATH=/qa'
      - '--set-env-vars=KYS_DB_URL=https://storage.googleapis.com/kys-agent-db/kys.db'
      - '--set-secrets=KYS_ACCESS_TOKEN=kys-access-token:latest'
      - '--set-secrets=GEMINI_API_KEY=gemini-api-key:latest'
      - '--set-secrets=KYS_OPENAI_API_KEY=openai-api-key:latest'

# Sizi kilitleyen hatayı çözen kritik ayar:
options:
  logging: CLOUD_LOGGING_ONLY